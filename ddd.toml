# Architecture contract for tape, checked by the workspace repo's
# scripts/meta/rust_arch_contract.py. docs/architecture.md explains it;
# docs/adr/0001-standard-layout-and-ddd.md records the decisions behind it.
# tape is a virtual workspace: one crate per context under crates/, the journal
# model as the shared kernel, and two assembly crates. depends_on lists the
# other tape contexts a context uses. Shared building blocks come from
# faberline/core.

schema = 1

[migration]
enforce = true

[policy]
version = 1
size_warn = 400
size_error = 1000
root_md = [
  "README.md",
  "CONTRIBUTING.md",
  "LICENSE.md",
  "CHANGELOG.md",
  "SECURITY.md",
  "CODE_OF_CONDUCT.md",
  "CLAUDE.md",
  "AGENTS.md",
  # Temporary: the current project docs contract requires these at the root.
  "STATUS.md",
  "ROADMAP.md",
]
docs_required = [
  "docs/README.md",
  "docs/architecture.md",
  "docs/glossary.md",
  "docs/domain/",
  "docs/adr/",
  "docs/operations/",
]
layers = ["domain", "application", "infrastructure", "interfaces"]
# The layer held to the [policy.domain] purity rules and kept free of other contexts.
domain_layer = "domain"
# Layers another context may use. A context without any of them exposes its whole public API.
public_layers = ["application"]
# <ctx>/domain/events(.rs|/) is the only domain module other contexts may use.
domain_events = "events"
# A tests/<name>.rs binary may stand alone only when it is the crate's single test
# target, contains one of these markers, or its leading //! block carries
# `//! isolation: <reason>`. Everything else lives in tests/it/.
test_isolation_markers = ["set_var(", "remove_var(", "#[global_allocator]"]
# tests/<dir>/ names holding .rs data (fixtures, trybuild cases), not test targets.
test_data_dirs = ["fixtures", "compile_fail", "ui"]
# false: one crate may hold several contexts (B3/B4 still guard each boundary).
# true: B1 requires every crate to belong to exactly one context.
one_context_per_crate = false

# Layers each layer may use inside one context. The shared kernel is usable by
# every layer; assembly code (the [assembly] crates) is unrestricted. A
# multi-file binary is src/bin/<name>/main.rs plus sibling modules: B6 keeps
# the entry file thin and does not apply to those modules.
[policy.layer_deps]
domain = []
application = ["domain"]
infrastructure = ["domain"]
interfaces = ["application"]

[policy.domain]
# Applies to every domain layer, and to the shared kernel when shared_kernel_pure.
allowed_crates = [
  "std",
  "core",
  "alloc",
  "thiserror",
  "serde",
  "serde_json",
  "chrono",
  "time",
  "uuid",
  "sha2",
  "hex",
  "regex",
  "bytes",
]
denied_paths = [
  "std::fs",
  "std::net",
  "std::process",
  "std::env",
  "std::os",
  "std::io::stdin",
  "std::io::stdout",
  "std::io::stderr",
  "std::thread::spawn",
  "std::thread::sleep",
  "std::time::SystemTime::now",
  "std::time::Instant::now",
  "chrono::Utc::now",
  "chrono::Local::now",
  "chrono::offset::Utc::now",
  "chrono::offset::Local::now",
  "time::OffsetDateTime::now_utc",
  "time::OffsetDateTime::now_local",
  "time::Instant::now",
  "uuid::Uuid::now_v7",
  "uuid::Uuid::new_v4",
]
denied_macros = ["println", "print", "eprintln", "eprint", "dbg"]
shared_kernel_pure = true

[policy.naming]
crates_dir = "crates"
domain_crate = "{repo}-{context}-domain"
context_crate = "{repo}-{context}"
shared_kernel_crate = "{repo}-shared-kernel"

# Module layout (no mod.rs) is enforced by clippy, not by this checker.
[policy.lints.clippy]
mod_module_files = "deny"

# The journal model -- TapeJournal, TapeCommand/TapeOutcome, events,
# checkpoints, subscriptions, retention, snapshots, the replay wire format, and
# the CommitLog/Replicator ports. Storage, replication and the journal use
# cases all build on it, so it is the shared kernel rather than one context's
# domain.
[shared_kernel]
path = "crates/tape-shared-kernel/src"

# Assembly: `tape` wires the contexts into the HTTP app, the backup runner and
# the `tape` binary; `tape-bench` drives that app for the benchmarks and the
# perf gate. Unrestricted.
[assembly]
crates = ["tape", "tape-bench"]

[[contexts]]
name = "storage"
depends_on = []
[contexts.layers]
infrastructure = "crates/tape-storage/src"

[[contexts]]
name = "replication"
depends_on = []
[contexts.layers]
infrastructure = "crates/tape-replication/src"

[[contexts]]
name = "access"
depends_on = []
[contexts.layers]
application = "crates/tape-access/src"

[[contexts]]
name = "journal"
depends_on = ["access"]
[contexts.layers]
application = "crates/tape-journal/src/application"
interfaces = "crates/tape-journal/src/interfaces"

[[contexts]]
name = "operator"
depends_on = []
[contexts.layers]
infrastructure = "crates/tape-operator/src"

[[exceptions]]
rule = "B2"
subject = "utoipa"
paths = [
  "crates/tape-shared-kernel/Cargo.toml",
  "crates/tape-shared-kernel/src/event.rs",
  "crates/tape-shared-kernel/src/retention.rs",
  "crates/tape-shared-kernel/src/subscription.rs",
]
reason = "utoipa::ToSchema is a compile-time description of the same serde wire shape. TapeEvent, ConsumerCheckpoint, Subscription, PullSubscriptionBatch, RetentionPolicy and RetentionOutcome are served as-is in tape's OpenAPI document (committed as clients/openapi.json, from which the generated clients are built) under these schema names, and a separate interfaces copy would duplicate the wire contract. The derive does no I/O. Long-term."
