# cargo-deny configuration
# Run with: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
version = 2
ignore = [
    # backoff 0.4.0, pinned by kube-runtime 0.98.0 (no patched release)
    "RUSTSEC-2025-0012",
    # instant 0.1.13, pinned by backoff 0.4.0 (no patched release)
    "RUSTSEC-2024-0384",
    # proc-macro-error 1.0.4, pinned by utoipa-gen 4.3.1 (no patched release)
    "RUSTSEC-2024-0370",
    # rustls-pemfile 2.2.0, pinned by kube-client 0.98.0 and peer-tls 0.1.0 (no patched release)
    "RUSTSEC-2025-0134",
    # unsafe-libyaml 0.2.11, pinned by serde_yaml 0.9.34 (no patched release)
    "RUSTSEC-2024-0449",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "OpenSSL",
    "CDDL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"  # Allow path dependencies in workspace
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
