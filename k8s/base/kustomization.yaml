apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tape

# Keep common labels out of immutable StatefulSet/Service selectors, which
# intentionally stay pinned to app+role for safe repeated applies.
labels:
  - pairs:
      app.kubernetes.io/name: tape
      app.kubernetes.io/part-of: tape
    includeSelectors: false

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - statefulset.yaml
  - service.yaml
  - pdb.yaml

# The Prometheus Operator and NetworkPolicy components remain opt-in. Dev can
# apply on a vanilla Kind cluster; staging/prod compose components explicitly.
