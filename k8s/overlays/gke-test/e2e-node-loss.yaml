# The cluster-wide part of the operator_nodeloss suite's access
# (k8s/gke-test-job/operator_nodeloss): `kubectl delete node` removes the Node
# object of the raft leader's node. A test Job folder may hold only namespaced
# kinds, so the grant lives here, for the suite's ServiceAccount tape/tape-e2e.
# The suite deletes only one Node of pool-tape-server, which only tape's pods
# and DaemonSets use. Cluster-scoped objects outlive the namespace, so both
# carry faberline.dev/owner-namespace: aw's teardown deletes the cluster RBAC
# with that label after it deletes the namespace, and the reaper deletes it
# once the namespace is gone.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tape-e2e-node-loss
  labels:
    faberline.dev/owner-namespace: tape
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tape-e2e-node-loss
  labels:
    faberline.dev/owner-namespace: tape
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tape-e2e-node-loss
subjects:
  - kind: ServiceAccount
    name: tape-e2e
    namespace: tape
