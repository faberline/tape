# GKE e2e suite `operator_recovery` (crates/tape/tests/it/e2e/operator_recovery.rs):
# the Tape CR `tape` reconciled by the shipped operator, reached at
# http://tape:7137. It replaces scripts/kind-e2e.sh.
#
# faberline/aw's run.sh deploys k8s/overlays/gke-test, waits for the operator
# rollout, sets this folder's namespace and test image, adds the ConfigMap
# gke-test-env (E2E_EXPECTED_*), applies it, and passes only when Job/tape-e2e
# completes and its log does not say `running 0 tests`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tape

resources:
  - rbac.yaml
  - job.yaml
