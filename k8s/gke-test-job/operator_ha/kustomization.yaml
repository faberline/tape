# GKE e2e suite `operator_ha` (crates/tape/tests/it/e2e/operator_ha.rs):
# the operator's leader election under a leader delete and a node drain.
#
# faberline/aw's run.sh deploys k8s/overlays/gke-test, waits for the operator
# rollout, sets this folder's namespace and test image, adds the ConfigMap
# gke-test-env (E2E_EXPECTED_*), applies it, and passes only when Job/tape-e2e
# completes and its log does not say `running 0 tests`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tape

resources:
  - rbac.yaml
  - job.yaml
