# What the suite reads and does in the run's namespace: it reads the operator
# pods, the Lease, and the metrics Service's endpoints, deletes the leader for
# the handover check, and patches the Tape CR's logLevel for the reconcile
# heartbeat. Draining a node is cluster-wide, so that grant is
# ClusterRole/tape-e2e-node-drain in k8s/overlays/gke-test.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tape-e2e
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tape-e2e
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/proxy", "pods/log"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["services", "endpoints", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["tape.dev"]
    resources: ["tapes"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tape-e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tape-e2e
subjects:
  - kind: ServiceAccount
    name: tape-e2e
    namespace: tape
