# GKE e2e suite `operator_soak` (crates/tape/tests/it/e2e/operator_soak.rs): the
# cluster form of scripts/soak.sh, a paid run. It is dispatch only: never in
# `all` and never in ci.yml. The ConfigMap gke-test-env carries E2E_SOAK_HOURS
# (default 4, from 0.05 to 5). The server is reached at http://tape:7137.
#
# faberline/aw's run.sh deploys k8s/overlays/gke-test, waits for the operator
# rollout, sets this folder's namespace and test image, adds the ConfigMap
# gke-test-env (E2E_EXPECTED_*), applies it, and passes only when Job/tape-e2e
# completes and its log does not say `running 0 tests`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tape

resources:
  - rbac.yaml
  - job.yaml
