# What the suite reads in the run's namespace, and nothing else: the memory
# of the server pod `tape-0` from the metrics API (metrics.k8s.io). The server
# image has no shell, so the suite does not exec into it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tape-e2e
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tape-e2e
rules:
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tape-e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tape-e2e
subjects:
  - kind: ServiceAccount
    name: tape-e2e
    namespace: tape
