# What the suite reads and does in the run's namespace: it reads the server
# pods and their logs, the StatefulSet and the Tape CR, reads /raftz of each
# server pod through the pod proxy, scales the operator Deployment to one
# replica, patches the Tape CR's spec, and force-deletes the leader's pod.
# Deleting the leader's Node is cluster-wide, so that grant is
# ClusterRole/tape-e2e-node-loss in k8s/overlays/gke-test.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tape-e2e
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tape-e2e
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/proxy", "pods/log"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
  - apiGroups: ["tape.dev"]
    resources: ["tapes"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tape-e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tape-e2e
subjects:
  - kind: ServiceAccount
    name: tape-e2e
    namespace: tape
