# Example for one watched namespace (here: tape). Same rule as role-children.yaml:
# copy per watched namespace and change metadata.namespace in both files.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tape-operator-children
  namespace: tape
  labels:
    app.kubernetes.io/name: tape-operator
    app.kubernetes.io/part-of: tape
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tape-operator-children
subjects:
  - kind: ServiceAccount
    name: tape-operator
    namespace: tape-system
