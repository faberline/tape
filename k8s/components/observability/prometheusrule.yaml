# HANDWRITE-BEGIN gap="missing-generator:logic:4449c2ec" tracker="#1588" reason="Alert on real Tape append/replay average-latency series and Kubernetes restart loops without inventing domain lag metrics. generator gap: missing-generator:prometheus-rule (#1588)."
#
# Editing an alert here? The operator renders a twin of this rule from
# `spec.observability` (#2575, src/operator/render.rs::prometheus_rule), and
# tests/operator.rs fails if the alert set, `for`, severity, summary, runbook
# text, metric names, or thresholds drift apart. The label SELECTORS are
# expected to differ — this file targets the static base's `app`/`role` labels,
# the operator targets the `app.kubernetes.io/*` set it stamps — so change both
# files together, and never copy an expr verbatim between them.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tape-slo
  namespace: tape
  labels:
    app: tape
    role: server
    release: prometheus
spec:
  groups:
    - name: tape.slo
      interval: 30s
      rules:
        - alert: TapeAppendLatencyHigh
          expr: |
            sum(rate(tape_append_latency_ms_sum{app="tape",role="server"}[5m]))
            / clamp_min(sum(rate(tape_append_latency_ms_count{app="tape",role="server"}[5m])), 1) > 500
          for: 10m
          labels: { severity: warning, app: tape, role: server }
          annotations:
            summary: "tape append average latency above 500ms"
        - alert: TapeReplayLatencyHigh
          expr: |
            sum(rate(tape_replay_latency_ms_sum{app="tape",role="server"}[5m]))
            / clamp_min(sum(rate(tape_replay_latency_ms_count{app="tape",role="server"}[5m])), 1) > 2000
          for: 10m
          labels: { severity: warning, app: tape, role: server }
          annotations:
            summary: "tape replay average latency above 2s"
        - alert: TapePodRestarting
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="tape",container="tape"}[15m]) > 2
          for: 5m
          labels: { severity: warning, app: tape, role: server }
          annotations:
            summary: "tape pod restarting repeatedly"
            runbook: "#2485: Differentiate seed-failure restarts by checking if `spec.bootstrapSeedUri` is set on the CR and examining the pod log for structured decision fields: (1) `decision=\"seeded\"` = seed succeeded, look for other causes (probe failures, image pull, resource limits); (2) `decision=\"skipped_existing_state\"` = seed was skipped (PVC already had data), pod is healthy; (3) NEITHER line present before a crash = seed fetch/decode failed (bad URI, IAM, corrupt object) — restore logs show which. #2468: the one-shot seed cleared bit is separate. See docs/deployment-handoff.md Cold restore runbook."
        - alert: TapeStorageDegraded
          # `max_over_time` on purpose: the node re-probes every 30s and clears
          # the gauge itself, so a volume that keeps filling and draining can
          # read 0 at every scrape while rejecting writes between them. The
          # window trades a ~5m tail after real recovery for not missing that.
          expr: |
            max_over_time(tape_storage_degraded{app="tape",role="server"}[5m]) > 0
          for: 2m
          labels: { severity: critical, app: tape, role: server }
          annotations:
            summary: "tape node in ENOSPC degraded read-only mode"
            runbook: "#2573: The node hit ENOSPC on its journal persist path and latched degraded read-only mode — mutating requests answer 507 `storage_full`, reads keep serving. Check `tape_storage_full_errors_total`: a rising counter with the gauge back at 0 means the volume is flapping in and out of full, not that it recovered. Remedy is capacity — free objects via retention or expand the PVC on a resizable StorageClass. No restart is needed: the pod re-probes the store directory every `TAPE_STORAGE_FULL_REPROBE_SECS` (default 30s) and clears the flag itself. If the gauge stays 1 after the volume has room, read the pod log for the re-probe warning — the store directory can be unwritable for reasons other than capacity (read-only remount, permissions). `TapePvcNearFull` is the early warning for this condition and should have fired first — if it did not, find out why before treating a full volume as a surprise."
        - alert: TapeRaftLeaderAbsent
          expr: |
            tape_raft_leader_known{app="tape",role="server"} == 0
          for: 2m
          labels: { severity: critical, app: tape, role: server }
          annotations:
            summary: "tape raft group has no elected leader"
            runbook: "#2579: This alert fires when the raft group has no elected leader, so replicated writes (append and checkpoint-put) cannot commit. Pods stay Ready and `/healthz` stays green while it is firing, which is exactly why this alert exists and why `TapeNoReadyServingPods` will not be firing alongside it. Check `/raftz` on each replica first, and confirm that a quorum of the CR's `voterCount` is actually running — a missing quorum is a leadership failure, not a pod health failure. Do not restart the remaining replicas to 'reset' the election: that makes quorum loss worse, not better. The underlying sentinel gauge `tape_raft_leader_known` is intentionally omitted until the first raft poll reports, so a non-raft node never publishes a permanent `0` and this alert stays silent there."
        - alert: TapeSubscriptionLagGrowing
          expr: |
            increase(tape_subscription_lag{app="tape",role="server"}[15m]) > 0
          for: 15m
          labels: { severity: warning, app: tape, role: server }
          annotations:
            summary: "tape subscription lag growing over 15m"
            runbook: "#2485: Check if the consumer bound to the subscription is alive and actively pulling. If the consumer has stopped or stalled, verify it has not crashed or exhausted resources. If the consumer is healthy, check the append rate to the topic — a rapid append rate combined with a slow consumer will naturally grow lag. No action needed if this is expected; adjust retention policy if needed to protect the subscription's checkpoint from expiry."
        - alert: TapeMemoryHeadroomLow
          # #3051. Unlike every other alert here, both series come from
          # cAdvisor, not from tape's own /metrics — so this one is scoped by
          # the kubelet's `namespace`/`container` labels and carries no
          # `app`/`role`, exactly as TapePodRestarting above.
          #
          # The `> 0` on the denominator is a filter, not a comparison: a
          # container with no memory limit reports the spec gauge as 0, and
          # dropping those samples leaves the division with nothing to match
          # rather than +Inf. Without it, every unbounded container in the
          # namespace would alert forever.
          expr: |
            max by (pod) (
            container_memory_working_set_bytes{namespace="tape",container="tape"}
            / (container_spec_memory_limit_bytes{namespace="tape",container="tape"} > 0)
            ) > 0.85
          for: 10m
          labels: { severity: warning, app: tape, role: server }
          annotations:
            summary: "tape container memory headroom below 15%"
            runbook: "#3051: The container's memory working set is within 15% of its limit, and the limit equals the request, so the next step is an OOMKill of this pod. Do NOT raise the limit as the remedy — it defers the wall and hides the growth again; the limit exists to make this growth visible. Act on the two causes you can fix now: (1) retention — `tape retention list` (or the CR's `spec.retention`); a topic with no entry is NEVER pruned and grows without bound, so give every active topic a byte or count bound; (2) a stalled consumer — check `tape_subscription_lag` and whether the bound consumer is still pulling, since a checkpoint that stops advancing pins events that retention would otherwise drop. If neither applies, the pod is holding more memory than its journal justifies: this is the whole-journal-rewrite persist path (`AppState::persist` serializes the entire journal on every mutation), which #3052 (WAL + group commit) removes. Capacity sizing is #2552 — do not derive a new limit from this alert alone."
        - alert: TapeNoReadyServingPods
          expr: |
            kube_statefulset_status_replicas_ready{namespace="tape",statefulset="tape"} == 0
          for: 2m
          labels: { severity: critical, app: tape, role: server }
          annotations:
            summary: "tape statefulset has zero ready replicas"
            runbook: "#2578: The StatefulSet reports zero ready replicas — tape is serving nothing, and no other alert covers this. `TapePodRestarting` needs more than 2 restarts in 15m, so a pod that never starts at all (Pending on an unschedulable PVC, an image pull failure, a readiness probe failing against a running process) is invisible to it. Check the pods first: `Pending` means scheduling or storage, so describe the pod and its PVC and read the binding event; `Running` but not ready means the readiness probe is failing, so read the pod log and probe `/readyz` inside the container. A node in ENOSPC degraded mode stays ready on purpose (#2573) — degraded read-only still serves reads — so this alert firing is not the degraded path and `TapeStorageDegraded` is the one to check for that."
        - alert: TapeBackupCronJobFailed
          # #2578. The threshold is 2 on purpose: one failed Job is flake
          # tolerance, but a second means the recent schedule is failing
          # repeatedly.
          expr: |
            kube_job_status_failed{namespace="tape",job_name=~"^tape-backup-.*"} >= 2
          for: 5m
          labels: { severity: warning, app: tape, role: server }
          annotations:
            summary: "tape scheduled backup failing on repeated runs"
            runbook: "#2578: Two or more of the retained backup Jobs for this instance have failed. The threshold is 2 on purpose — one failed Job is flake tolerance (a transient object-store error, a node eviction mid-run), two means the schedule is failing on every recent run and the newest backup you can restore from is older than the schedule implies. Read the log of the newest failed Job. The two usual causes are credentials (the admin token the backup runner authenticates with) and the destination (bucket permissions, or a URI that no longer resolves). Confirm the age of the last successful backup before treating this as low priority: this alert says the schedule is broken, not that the data is gone. The CR-level companion is the `BackupSucceeded` condition on the Tape status (#3071), which reports the same CronJob's outcome without Prometheus."
        - alert: TapePvcNearFull
          # #2578. The PVC template is named `data`, not `raft`, so the
          # selector must match `^data-<name>-[0-9]+$`.
          expr: |
            kubelet_volume_stats_available_bytes{namespace="tape",persistentvolumeclaim=~"^data-tape-[0-9]+$"}
            / kubelet_volume_stats_capacity_bytes{namespace="tape",persistentvolumeclaim=~"^data-tape-[0-9]+$"} < 0.1
          for: 10m
          labels: { severity: warning, app: tape, role: server }
          annotations:
            summary: "tape data PVC below 10% free"
            runbook: "#2578: The data PVC for this instance is below 10% free. This is the early warning `TapeStorageDegraded` does not give you — that one only fires once writes are already being refused with 507. Act while writes still succeed. Free space by tightening retention: a topic with no retention entry is NEVER pruned and grows without bound, so give every active topic a byte or count bound. Otherwise expand the PVC, which is the only remedy that loses nothing — it requires `allowVolumeExpansion: true` on the StorageClass, so confirm that now rather than during the incident. If `TapeStorageDegraded` is already firing as well, this alert should have fired ten minutes earlier; if it did not, the volume filled faster than the `for: 10m` window and the budget is wrong for this workload."
# HANDWRITE-END
