#
# This component targets the STATIC kustomize base (k8s/base), whose objects
# carry `app: tape` / `role: server`. The operator renders its own twin from
# `spec.observability` (#2575, crates/tape-operator/src/render/observability.rs::service_monitor) against
# the `app.kubernetes.io/*` labels it stamps instead — so the two selectors are
# deliberately different and neither can be copied onto the other's path.
# crates/tape/tests/it/operator.rs holds the two in step on everything that is NOT a label.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tape
  namespace: tape
  labels:
    app: tape
    role: server
    release: prometheus
spec:
  namespaceSelector:
    matchNames: [tape]
  selector:
    matchLabels:
      app: tape
      role: server
  targetLabels: [app, role]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
