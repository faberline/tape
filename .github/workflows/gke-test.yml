# tape on Faberline's shared GKE test cluster (faberline-test).
#
# faberline/aw's reusable gke-test workflow deploys k8s/overlays/gke-test (the
# operator and the Tape CR `tape`) with the image under test on
# pool-tape-server, runs one suite's test Job on pool-tape-client, uploads the
# evidence artifact gke-test-evidence-<run_id>-<attempt>-<suite>, and tears the
# namespace down. The test Job runs the Rust suite
# crates/tape/tests/it/e2e/<suite>.rs from the tape-test-client image; every
# check, image identity included, is in Rust (aw docs/standards/rust-tests.md).
#
# Suites (aw docs/standards/test-cluster.md "Test suites"), one call each, one
# at a time, each on a fresh deploy:
#   operator_recovery  k8s/gke-test-job/operator_recovery
#   operator_ha        k8s/gke-test-job/operator_ha
# A pull request runs all of them; a dispatch can pick one.
#
# GKE runs linux/amd64 only. The suite `image` covers linux/arm64 without a
# cluster: the image-arm64 job runs crates/tape/tests/it/e2e/image.rs on
# GitHub's arm64 runner, which starts the arm64 child of the same image with
# docker (rust-tests.md rule 6). aw owns the cluster, both pools, and the
# gke-test-tape service account (infra/gke-test/pools.yaml in faberline/aw);
# nothing here creates cloud resources.
#
# Images, both from the same commit:
#   ghcr.io/faberline/tape:sha-<git12>              tape-test-image.yml (server)
#   ghcr.io/faberline/tape-test-client:sha-<git12>  the test-client job below
# Both are pinned by digest before the run.
name: gke-test

on:
  pull_request:
    paths:
      - ".github/workflows/gke-test.yml"
      - ".github/workflows/tape-test-image.yml"
      - "Dockerfile.test"
      - "k8s/**"
      - "crates/tape-operator/**"
      - "crates/tape/tests/it/e2e/**"
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run; all runs every suite, one at a time.
        type: choice
        options: [all, operator_recovery, operator_ha]
        default: all

permissions:
  contents: read

jobs:
  image:
    name: build server image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/tape-test-image.yml

  test-client:
    name: build test-client image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tape-test-client-x86_64-unknown-linux-musl

      # Same target and features as the server binary of tape-test-image.yml,
      # so the test binary fits the same static base image.
      - name: Build the test binary
        shell: bash
        run: |
          set -euo pipefail
          exe="$(cargo test --release --locked --target x86_64-unknown-linux-musl \
              -p tape --features "operator backup self-update issue" \
              --test it --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "it") | .executable')"
          [[ -n "$exe" && -x "$exe" ]] || { echo "::error::no test binary for it"; exit 1; }
          mkdir -p dist/linux/amd64
          cp "$exe" dist/linux/amd64/tape-it

      - name: Resolve image tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          git12="$(git rev-parse HEAD | cut -c1-12)"
          echo "tag=ghcr.io/${{ github.repository_owner }}/tape-test-client:sha-${git12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the test-client image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.test
          target: test-client
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ver.outputs.tag }}

      - name: Record pushed digest
        id: digest
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad digest: $DIGEST"; exit 1; }
          echo "image=ghcr.io/${{ github.repository_owner }}/tape-test-client@${DIGEST}" >> "$GITHUB_OUTPUT"

  resolve:
    name: resolve image identity
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.identity.outputs.image }}
      version: ${{ steps.identity.outputs.version }}
      git-sha: ${{ steps.identity.outputs.git_sha }}
      arm64-digest: ${{ steps.identity.outputs.arm64_digest }}
      test-env: ${{ steps.identity.outputs.test_env }}
      suites: ${{ steps.identity.outputs.suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pin the image and its expected identity
        id: identity
        shell: bash
        env:
          RAW_IMAGE: ${{ needs.image.outputs.image }}
          # A pull request has no inputs, so it runs all suites.
          INPUT_SUITE: ${{ inputs.suite || 'all' }}
        run: |
          set -euo pipefail
          die() { echo "::error::$*" >&2; exit 1; }
          [[ "$RAW_IMAGE" =~ ^ghcr\.io/faberline/tape:sha-([0-9a-f]{12})@(sha256:[0-9a-f]{64})$ ]] \
            || die "image must be ghcr.io/faberline/tape:sha-<git12>@sha256:<64 hex>, got: $RAW_IMAGE"
          git_sha="${BASH_REMATCH[1]:0:8}"
          root_digest="${BASH_REMATCH[2]}"
          image="ghcr.io/faberline/tape@${root_digest}"

          version="$(grep '^version = ' Cargo.toml | head -n1 | cut -d'"' -f2)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || die "invalid version: $version"

          raw="$(docker buildx imagetools inspect --raw "$image")"
          child() {
            jq -r --arg arch "$1" '
              [.manifests[]? | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest] |
              if length == 1 then .[0] else empty end' <<<"$raw"
          }
          runtime_digest="$(child amd64)"
          arm64_digest="$(child arm64)"
          [[ "$runtime_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || die "no single linux/amd64 child digest for $image"
          [[ "$arm64_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || die "no single linux/arm64 child digest for $image"
          [[ "$runtime_digest" != "$root_digest" ]] || die "runtime child digest must differ from the root index digest"

          case "$INPUT_SUITE" in
            all) suites='["operator_recovery","operator_ha"]' ;;
            operator_recovery | operator_ha) suites="[\"${INPUT_SUITE}\"]" ;;
            *) die "suite must be all, operator_recovery or operator_ha, got: $INPUT_SUITE" ;;
          esac

          {
            echo "image=${image}"
            echo "version=${version}"
            echo "git_sha=${git_sha}"
            echo "arm64_digest=${arm64_digest}"
            echo "suites=${suites}"
            echo "test_env<<EOF"
            echo "E2E_EXPECTED_VERSION=${version}"
            echo "E2E_EXPECTED_GIT_SHA=${git_sha}"
            echo "E2E_EXPECTED_IMAGE=${image}"
            echo "E2E_EXPECTED_RUNTIME_DIGEST=${runtime_digest}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### tape gke-test identity"
            echo
            echo '```text'
            echo "image:          ${image}"
            echo "version:        ${version}"
            echo "git_sha:        ${git_sha}"
            echo "runtime_digest: ${runtime_digest}"
            echo "arm64_digest:   ${arm64_digest}"
            echo "suites:         ${suites}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  gke-test:
    name: GKE e2e (${{ matrix.suite }})
    needs: [resolve, test-client]
    # One call at a time: the repository's concurrency group in aw keeps only
    # one waiting run. fail-fast off runs the other suites when one fails.
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.resolve.outputs.suites) }}
    permissions:
      id-token: write
      contents: read
      packages: read
    uses: faberline/aw/.github/workflows/gke-test.yml@main
    with:
      image: ${{ needs.resolve.outputs.image }}
      image-name: ghcr.io/faberline/tape
      namespace: tape
      test-job: k8s/gke-test-job/${{ matrix.suite }}
      test-image: ${{ needs.test-client.outputs.image }}
      test-image-name: tape-test-client
      test-env: ${{ needs.resolve.outputs.test-env }}
      evidence-suffix: ${{ matrix.suite }}

  image-arm64:
    name: image e2e (arm64)
    needs: resolve
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert native aarch64 runner architecture
        shell: bash
        run: test "$(uname -m)" = aarch64

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tape-image-e2e-aarch64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Every check is in the Rust suite; the step fails when the filter
      # matches no test, because libtest passes on zero tests.
      - name: Run the image suite on the arm64 child
        shell: bash
        env:
          E2E_STANDALONE_IMAGE: ${{ needs.resolve.outputs.image }}
          E2E_EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
          E2E_EXPECTED_GIT_SHA: ${{ needs.resolve.outputs.git-sha }}
          E2E_EXPECTED_IMAGE: ${{ needs.resolve.outputs.image }}
          E2E_EXPECTED_RUNTIME_DIGEST: ${{ needs.resolve.outputs.arm64-digest }}
        run: |
          set -euo pipefail
          cargo test --locked -p tape --features "operator backup self-update issue" \
              --test it -- --ignored --test-threads=1 "e2e::image::" 2>&1 | tee image-e2e.log
          grep -Eq '^test result: ok\. [1-9][0-9]* passed' image-e2e.log \
            || { echo "::error::the filter e2e::image:: ran no test"; exit 1; }
