name: ci-infrastructure
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/issue-ci/**"
      - ".github/issue-ci*.json"
      - "docs/engineering/issue-ci-handoff.md"
permissions:
  contents: read
concurrency:
  group: ci-infrastructure-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  infrastructure:
    name: infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate live failure-only required gates
        run: |
          python3 scripts/issue-ci/check-policy.py .github/issue-ci-required-gates.json
      - name: Validate candidate qualification gates
        run: |
          python3 scripts/issue-ci/validate-policy.py .github/issue-ci-candidate-gates.json
      - name: Run infrastructure unit test suite
        run: |
          python3 -m unittest discover -s scripts/issue-ci/tests -v
