name: affected-docs
on:
  pull_request:
    paths:
      - "docs/operations/README.md"
      - "docs/runbooks/cold-restore.md"
      - "docs/runbooks/disk-full.md"
permissions:
  contents: read
concurrency:
  group: affected-docs-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  docs-copy-contract:
    name: docs-copy-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate docs copy contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/issue-ci/validate-docs-copy.py \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --head-ref "${{ github.event.pull_request.head.sha }}"
  backup-destination-docs:
    name: backup-destination-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tape-affected-docs-test
      - name: Run affected docs test
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/issue-ci/run-backup-docs-tests.py
