name: affected-docs
on:
  pull_request:
    paths:
      - "docs/operations/README.md"
      - "docs/runbooks/cold-restore.md"
      - "docs/runbooks/disk-full.md"
permissions:
  contents: read
concurrency:
  group: affected-docs-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  docs-copy-contract:
    name: docs-copy-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base infrastructure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          persist-credentials: false
      - name: Checkout product PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: product-head
          persist-credentials: false
      - name: Validate docs copy contract from trusted base
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 trusted-base/scripts/issue-ci/validate-docs-copy.py \
            --base-dir trusted-base \
            --head-dir product-head \
            --base-ref "$BASE_SHA" \
            --head-ref "$HEAD_SHA"
  backup-destination-docs:
    name: backup-destination-docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify git HEAD equals product head SHA
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          CURRENT_HEAD=$(git rev-parse HEAD)
          echo "Verified git HEAD=$CURRENT_HEAD (expected product head: $HEAD_SHA), frozen base: $BASE_SHA"
          test "$CURRENT_HEAD" = "$HEAD_SHA"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tape-affected-docs-test
      - name: Run affected docs test
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 scripts/issue-ci/run-backup-docs-tests.py
