# OFFLINE candidate: publication/permission activation requires explicit approval.
name: Claude issue findings
run-name: claude-findings-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
on:
  workflow_run:
    workflows: ["Issue CI handoff"]
    types: [completed]
permissions: {}
concurrency:
  group: claude-findings-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false
jobs:
  publish-findings:
    if: ${{ github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
    steps:
      - name: Verify review and publish linked-issue findings
        uses: faberline/aw/.github/actions/claude-findings@c9ec41e3e01c2a0c9462e3de5c64ed0a5ea320d5
