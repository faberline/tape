# CI stages: lint -> test -> e2e -> gate.
# See https://github.com/faberline/aw/blob/main/docs/standards/ci.md
# The ruleset requires only the "gate" job. Keep its name fixed.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: "lint: fmt, clippy"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      e2e: ${{ steps.select.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Chooses the e2e jobs. A pull request runs them only when a path they test changed.
      - name: Select the e2e jobs
        id: select
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          e2e=true
          if [[ "$EVENT" == "pull_request" ]]; then
            e2e=false
            changed="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
            if grep -Eq '^(\.github/workflows/(ci|gke-test|tape-test-image)\.yml$|Dockerfile\.test$|k8s/|crates/tape-operator/|crates/tape/tests/it/e2e/)' <<<"$changed"; then
              e2e=true
            fi
          fi
          echo "e2e=${e2e}" >> "$GITHUB_OUTPUT"

  test-workspace:
    name: "test: workspace"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tape-ci-test
      - run: cargo test --locked --workspace

  test-features:
    name: "test: tape (operator, backup)"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tape-ci-test
      - run: cargo test --locked -p tape --features operator,backup

  test-coverage:
    name: "test: workspace, coverage"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tape-ci-coverage
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: cargo llvm-cov --workspace --locked --json --summary-only --output-path target/coverage.json
      - uses: faberline/aw/.github/actions/coverage@becaad89a4f25b59f94c735e09e4387b7ca35cea # S8
        with:
          summary: target/coverage.json

  # The backup destination docs test, moved from affected-docs.yml (job backup-destination-docs).
  test-docs-tests:
    name: "test: backup destination docs"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout product PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tape-ci-docs
      - name: Run backup destination docs test
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/run-backup-docs-tests.py

  test-perf:
    name: "test: perf gate"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tape-ci-test
      - run: cargo test --release --locked -p tape-bench --test tape_perf_gate

  # Reusable workflow: the server image, as in gke-test.yml (job image).
  e2e-image:
    name: "e2e: build server image"
    needs: [test-workspace, test-features, lint]
    if: needs.lint.outputs.e2e == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/tape-test-image.yml

  e2e-test-client:
    name: "e2e: build test-client image"
    needs: [test-workspace, test-features, lint]
    if: needs.lint.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.1
          targets: x86_64-unknown-linux-musl

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tape-test-client-x86_64-unknown-linux-musl

      # Same target and features as the server binary of tape-test-image.yml,
      # so the test binary fits the same static base image.
      - name: Build the test binary
        shell: bash
        run: |
          set -euo pipefail
          exe="$(cargo test --release --locked --target x86_64-unknown-linux-musl \
              -p tape --features "operator backup self-update issue" \
              --test it --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "it") | .executable')"
          [[ -n "$exe" && -x "$exe" ]] || { echo "::error::no test binary for it"; exit 1; }
          mkdir -p dist/linux/amd64
          cp "$exe" dist/linux/amd64/tape-it

      - name: Resolve image tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          git12="$(git rev-parse HEAD | cut -c1-12)"
          echo "tag=ghcr.io/${{ github.repository_owner }}/tape-test-client:sha-${git12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the test-client image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.test
          target: test-client
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ver.outputs.tag }}

      - name: Record pushed digest
        id: digest
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad digest: $DIGEST"; exit 1; }
          echo "image=ghcr.io/${{ github.repository_owner }}/tape-test-client@${DIGEST}" >> "$GITHUB_OUTPUT"

  e2e-resolve:
    name: "e2e: resolve image identity"
    needs: [e2e-image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.identity.outputs.image }}
      version: ${{ steps.identity.outputs.version }}
      git-sha: ${{ steps.identity.outputs.git_sha }}
      arm64-digest: ${{ steps.identity.outputs.arm64_digest }}
      test-env: ${{ steps.identity.outputs.test_env }}
      suites: ${{ steps.identity.outputs.suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pin the image and its expected identity
        id: identity
        shell: bash
        env:
          RAW_IMAGE: ${{ needs.e2e-image.outputs.image }}
          # A pull request has no inputs, so it runs all suites.
          INPUT_SUITE: ${{ inputs.suite || 'all' }}
        run: |
          set -euo pipefail
          die() { echo "::error::$*" >&2; exit 1; }
          [[ "$RAW_IMAGE" =~ ^ghcr\.io/faberline/tape:sha-([0-9a-f]{12})@(sha256:[0-9a-f]{64})$ ]] \
            || die "image must be ghcr.io/faberline/tape:sha-<git12>@sha256:<64 hex>, got: $RAW_IMAGE"
          git_sha="${BASH_REMATCH[1]:0:8}"
          root_digest="${BASH_REMATCH[2]}"
          image="ghcr.io/faberline/tape@${root_digest}"

          version="$(grep '^version = ' Cargo.toml | head -n1 | cut -d'"' -f2)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || die "invalid version: $version"

          raw="$(docker buildx imagetools inspect --raw "$image")"
          child() {
            jq -r --arg arch "$1" '
              [.manifests[]? | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest] |
              if length == 1 then .[0] else empty end' <<<"$raw"
          }
          runtime_digest="$(child amd64)"
          arm64_digest="$(child arm64)"
          [[ "$runtime_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || die "no single linux/amd64 child digest for $image"
          [[ "$arm64_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || die "no single linux/arm64 child digest for $image"
          [[ "$runtime_digest" != "$root_digest" ]] || die "runtime child digest must differ from the root index digest"

          case "$INPUT_SUITE" in
            all) suites='["operator_recovery","operator_ha"]' ;;
            operator_recovery | operator_ha) suites="[\"${INPUT_SUITE}\"]" ;;
            *) die "suite must be all, operator_recovery or operator_ha, got: $INPUT_SUITE" ;;
          esac

          {
            echo "image=${image}"
            echo "version=${version}"
            echo "git_sha=${git_sha}"
            echo "arm64_digest=${arm64_digest}"
            echo "suites=${suites}"
            echo "test_env<<EOF"
            echo "E2E_EXPECTED_VERSION=${version}"
            echo "E2E_EXPECTED_GIT_SHA=${git_sha}"
            echo "E2E_EXPECTED_IMAGE=${image}"
            echo "E2E_EXPECTED_RUNTIME_DIGEST=${runtime_digest}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### tape gke-test identity"
            echo
            echo '```text'
            echo "image:          ${image}"
            echo "version:        ${version}"
            echo "git_sha:        ${git_sha}"
            echo "runtime_digest: ${runtime_digest}"
            echo "arm64_digest:   ${arm64_digest}"
            echo "suites:         ${suites}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e-gke:
    name: "e2e: GKE (${{ matrix.suite }})"
    needs: [e2e-resolve, e2e-test-client]
    # One call at a time: the repository's concurrency group in aw keeps only
    # one waiting run. fail-fast off runs the other suites when one fails.
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.e2e-resolve.outputs.suites) }}
    permissions:
      id-token: write
      contents: read
      packages: read
    uses: faberline/aw/.github/workflows/gke-test.yml@bfa0a46a6a822293e88882793c57b28413b2d390
    with:
      aw-ref: bfa0a46a6a822293e88882793c57b28413b2d390
      image: ${{ needs.e2e-resolve.outputs.image }}
      image-name: ghcr.io/faberline/tape
      namespace: tape
      test-job: k8s/gke-test-job/${{ matrix.suite }}
      test-image: ${{ needs.e2e-test-client.outputs.image }}
      test-image-name: tape-test-client
      test-env: ${{ needs.e2e-resolve.outputs.test-env }}
      evidence-suffix: ${{ matrix.suite }}

  e2e-image-arm64:
    name: "e2e: image (arm64)"
    needs: [e2e-resolve]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert native aarch64 runner architecture
        shell: bash
        run: test "$(uname -m)" = aarch64

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tape-image-e2e-aarch64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Every check is in the Rust suite; the step fails when the filter
      # matches no test, because libtest passes on zero tests.
      - name: Run the image suite on the arm64 child
        shell: bash
        env:
          E2E_STANDALONE_IMAGE: ${{ needs.e2e-resolve.outputs.image }}
          E2E_EXPECTED_VERSION: ${{ needs.e2e-resolve.outputs.version }}
          E2E_EXPECTED_GIT_SHA: ${{ needs.e2e-resolve.outputs.git-sha }}
          E2E_EXPECTED_IMAGE: ${{ needs.e2e-resolve.outputs.image }}
          E2E_EXPECTED_RUNTIME_DIGEST: ${{ needs.e2e-resolve.outputs.arm64-digest }}
        run: |
          set -euo pipefail
          cargo test --locked -p tape --features "operator backup self-update issue" \
              --test it -- --ignored --test-threads=1 "e2e::image::" 2>&1 | tee image-e2e.log
          grep -Eq '^test result: ok\. [1-9][0-9]* passed' image-e2e.log \
            || { echo "::error::the filter e2e::image:: ran no test"; exit 1; }

  gate:
    name: gate
    if: always()
    needs:
      - lint
      - test-workspace
      - test-features
      - test-docs-tests
      - test-perf
      - test-coverage
      - e2e-image
      - e2e-test-client
      - e2e-resolve
      - e2e-gke
      - e2e-image-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every stage
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '.lint.result == "success"' > /dev/null
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
