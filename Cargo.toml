[workspace]
resolver = "2"
# One crate per bounded context plus the shared kernel and two assembly
# crates (see ddd.toml and docs/adr/0002-multi-crate-workspace.md).
members = ["crates/*"]

[workspace.package]
# tape releases independently (tape@<version> tags →
# .github/workflows/tape-release.yml). Every member inherits this version.
version = "0.6.0"
edition = "2021"
authors = ["Chris Cheng <chris.cheng.c4@gmail.com>"]
license = "MIT"
repository = "https://github.com/faberline/tape"

[workspace.dependencies]
# tape crates.
tape = { path = "crates/tape" }
tape-access = { path = "crates/tape-access" }
tape-journal = { path = "crates/tape-journal" }
tape-operator = { path = "crates/tape-operator" }
tape-replication = { path = "crates/tape-replication" }
tape-shared-kernel = { path = "crates/tape-shared-kernel" }
tape-storage = { path = "crates/tape-storage" }

# faberline/core building blocks.
build-stamp = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
cli-std = { git = "https://github.com/faberline/core", tag = "v0.4.14", default-features = false }
# Prometheus metric primitives (Counter/Latency + text-format render).
metrics-prometheus = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
# Shared polyglot OpenAPI client codegen (#1329): `tape spec gen`.
openapi-codegen = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
# Shared peer mTLS material/configuration for the Raft transport.
peer-tls = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
# Shared raft driver (#1327): RaftHost/RaftStore/RaftStateMachine,
# ClusterTopology::from_env, OutcomeWindow, SnapshotPolicy/HostConfig.
raft-runtime = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
# Shared shutdown deadline: one absolute budget for the HTTP drain and the
# raft host's leadership handoff (`RaftHost::shutdown_within`).
server-lifecycle = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
# Shared bearer-token auth contract (#1326).
service-auth = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
# Shared backup contract (#1329): destination/policy schema, BackupSink,
# local + s3 sinks, run_backup_once.
service-backup = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
# Shared service shell (#1325): probe routes, the h2c + HTTP/1.1 serve loop,
# graceful drain, and the {error, message} ApiErr envelope.
service-http = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
# Shared operator scaffold + render toolkit (#1328).
service-k8s = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
# Shared durable file replacement for the WAL, snapshots and raft markers.
storage-durable = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
transport-h2c = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
rig = { git = "https://github.com/faberline/rig", rev = "1fbe487eb4a94d745447227dbc974c3eb3e9fbd5" }

# Third-party. kube-rs versions mirror the other faberline users so the
# lockfile stays single-versioned.
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "string", "env"] }
futures = "0.3"
http-body-util = "0.1"
k8s-openapi = { version = "0.24", features = ["v1_32"] }
kube = { version = "0.98", features = ["runtime", "derive", "client"] }
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "system-proxy", "rustls-tls-native-roots", "json", "cookies", "gzip", "brotli", "multipart", "stream"] }
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = "4"

[workspace.lints.clippy]
mod_module_files = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
