# Controller vendored unchanged from faberline/aw@693e45bded9a4ec8167573e82b423c823c193ec0.
# Failure-only: current-head failures may return doing to todo; done is disabled.
# This is a trusted default-branch workflow, NOT pull_request_target execution.
name: Issue CI handoff
on:
  workflow_run:
    workflows: ["gke-test"]
    types: [completed]
permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: write
# All handoff invocations share this group. Default pending replacement is
# safe because EVERY wake reconciles ALL managed PRs, including displaced wakes.
concurrency:
  group: issue-ci-handoff
  cancel-in-progress: false
jobs:
  handoff:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Pin actions/checkout to a reviewed immutable commit in the consumer.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate failure-only qualification policy
        run: python3 scripts/issue-ci/check-policy.py .github/issue-ci-required-gates.json
      - name: Reconcile current PRs using trusted controller and config
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          # Reconcile all managed PRs from fresh metadata, not just this event's
          # PR. This prevents pending replacement from stranding another PR.
          python3 scripts/issue-ci/handoff.py \
            --repo "$REPO" --run-id "$RUN_ID" --reconcile \
            --config .github/issue-ci-required-gates.json

  # OFFLINE ENABLE AUDIT CANDIDATE: not authorized for publication/deployment.
  # Review-only tail after successful same-repository PR tests and handoff.
  # The handoff above is unchanged; no secret enters a pull_request workflow.
  claude-preflight:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    needs: handoff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    outputs:
      eligible: ${{ steps.preflight.outputs.eligible }}
      pr: ${{ steps.preflight.outputs.pr }}
      head: ${{ steps.preflight.outputs.head }}
    steps:
      - uses: faberline/aw/.github/actions/claude-review@c9ec41e3e01c2a0c9462e3de5c64ed0a5ea320d5
        id: preflight
        with:
          operation: preflight
          pr: ${{ github.event.workflow_run.pull_requests[0].number }}
          head: ${{ github.event.workflow_run.head_sha }}
          review-run: ${{ github.run_id }}

  claude-final-review:
    if: ${{ needs.claude-preflight.result == 'success' && needs.claude-preflight.outputs.eligible == 'true' }}
    needs: claude-preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout trusted default-branch provisioning only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/issue-ci/provision-claude.py
            .github/claude-review-cli-supply.json
      - name: Verify and stage pinned official CLI without credentials
        id: provision
        run: python3 -I scripts/issue-ci/provision-claude.py
      - name: Install verified binary on the disposable runner
        env:
          VERIFIED_BINARY: ${{ steps.provision.outputs.binary }}
        run: sudo install -m 0755 -- "$VERIFIED_BINARY" /usr/local/bin/claude
      - name: Review exact current head after all existing required gates
        uses: faberline/aw/.github/actions/claude-review@c9ec41e3e01c2a0c9462e3de5c64ed0a5ea320d5
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          operation: review
          pr: ${{ needs.claude-preflight.outputs.pr }}
          head: ${{ needs.claude-preflight.outputs.head }}
          review-run: ${{ github.run_id }}
