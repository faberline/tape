[project]
name = "tape"
# Shared SaaS service skeleton (aw docs/standards/saas-service.md, S5).
kind = "saas-service"
cap_path = "README.md"
label = "app:tape"

[capability.profile]
traits = ["service", "long_running", "cli_facing", "competitive_replacement", "network_exposed", "primary_replicas", "stateful_storage"]

[[workspaces]]
name = "tape"
paths = ["**"]
target = "rust"
test_cmd = "cargo test --workspace"
codegen.profile = "rust/score-crate"

[impl]
build = "cargo test --locked --workspace --lib --no-run"
test = "cargo test --locked --workspace --lib"
harness = "cargo"

[[standards.ci.exception]]
check = "CI7"
reason = "test-deps joins gate.needs in tape#144 after cargo audit passes; remove this exception there"

[standards.coverage]
line = 67.89
target = 100
